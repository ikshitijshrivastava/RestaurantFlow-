<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RestaurantFlow</title><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signInAnonymously,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,getDoc,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyCJnTbRa-fNc6AOuLBedv6CFv4qsSUyd9k',authDomain:'restaurantflow-4a128.firebaseapp.com',projectId:'restaurantflow-4a128',storageBucket:'restaurantflow-4a128.firebasestorage.app',messagingSenderId:'1016067698301',appId:'1:1016067698301:web:0a9871e115210140f34b14'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);let u,cart=[],tableId=new URLSearchParams(location.search).get('tableId'),table=new URLSearchParams(location.search).get('table')||tableId;
const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function view(){document.body.innerHTML=tableId?customer():adminLogin();if(tableId)initCustomer();else initAdmin()}
function customer(){return `<main><div class="top"><div><h1>RestaurantFlow</h1><p>Table <b>${esc(table)}</b> · Scan-to-order</p></div><span class="pill">Customer</span></div><section><h2>Menu</h2><select id="cat"><option value="">All categories</option></select><div id="menu"></div></section><section><h2>Cart</h2><div id="cart">Your cart is empty.</div><div class="sum">Subtotal: <b id="sub">₹0.00</b></div><label>Mobile number<input id="mobile" inputmode="tel" placeholder="10-digit mobile"></label><label>Tip (optional)<input id="tip" type="number" min="0" value="0"></label><label>Payment timing<select id="timing"><option>Loading…</option></select></label><div id="paynote" class="note"></div><button id="place">Confirm Order</button><div id="msg"></div></section></main>`}
function adminLogin(){return `<main class="login"><section><h1>RestaurantFlow</h1><p>Admin / staff access</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button id="login">Sign in</button><div id="msg"></div></section></main>`}
async function initCustomer(){try{await signInAnonymously(auth);const[cats,items,rest]=await Promise.all([getDocs(collection(db,'categories')),getDocs(collection(db,'menuItems')),getDoc(doc(db,'restaurants','demo'))]);const c=cats.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.active!==false),arr=items.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.active!==false&&x.available!==false);$('cat').innerHTML='<option value="">All categories</option>'+c.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');const mode=rest.exists()?rest.data().paymentTiming||'postpaid':'postpaid';$('timing').innerHTML=mode==='prepaid'?'<option value="prepaid">Pay now</option>':mode==='customer_choice'?'<option value="postpaid">Pay later</option><option value="prepaid">Pay now</option>':'<option value="postpaid">Pay later</option>';if(mode==='prepaid')$('paynote').textContent='Pre-payment selected. Connect a verified gateway before accepting live payments.';renderMenu(arr);$('cat').onchange=()=>renderMenu(arr);$('tip').oninput=renderCart;$('place').onclick=place}catch(e){$('msg').textContent=e.message}}
function renderMenu(arr){const cat=$('cat').value;$('menu').innerHTML=arr.filter(x=>!cat||x.categoryId===cat).map(x=>`<article class="item"><div><b>${esc(x.name)}</b><small>${esc(x.foodType||'Other')} · ${money(x.price)}</small><p>${esc(x.description||'')}</p></div><button onclick="add('${x.id}')">Add</button></article>`).join('')||'<p>No available items.</p>';window._items=arr}
window.add=id=>{const x=window._items.find(x=>x.id===id),f=cart.find(x=>x.id===id);f?f.qty++:cart.push({...x,qty:1});renderCart()};function renderCart(){const sub=cart.reduce((a,x)=>a+Number(x.price)*x.qty,0);$('sub').textContent=money(sub);$('cart').innerHTML=cart.map(x=>`<div class="line"><span>${esc(x.name)} × ${x.qty}</span><span>${money(x.price*x.qty)} <button onclick="minus('${x.id}')">−</button><button onclick="add('${x.id}')">+</button></span></div>`).join('')||'Your cart is empty.'}window.minus=id=>{const x=cart.find(x=>x.id===id);if(x){x.qty--;if(x.qty<1)cart=cart.filter(y=>y.id!==id)}renderCart()};
async function place(){if(!cart.length)return $('msg').textContent='Add at least one item.';if(!$('mobile').value.trim())return $('msg').textContent='Enter mobile number.';if($('timing').value==='prepaid')return $('msg').textContent='Pre-payment is enabled, but no verified payment gateway is connected yet.';const sub=cart.reduce((a,x)=>a+Number(x.price)*x.qty,0),tip=Number($('tip').value)||0;try{const r=await addDoc(collection(db,'orders'),{restaurantId:'demo',tableId,table,mobile:$('mobile').value.trim(),customerUid:u.uid,items:cart.map(x=>({id:x.id,name:x.name,price:Number(x.price),qty:x.qty,foodType:x.foodType||'Other'})),subtotal:sub,discount:0,tax:0,tip,total:sub+tip,status:'new',paymentStatus:'pending',paymentTiming:'postpaid',createdAt:serverTimestamp()});cart=[];renderCart();$('msg').textContent='Order placed: '+r.id;$('msg').className='ok'}catch(e){$('msg').textContent=e.message}}
function initAdmin(){$('login').onclick=async()=>{try{u=(await signInWithEmailAndPassword(auth,$('email').value,$('pass').value)).user;await admin()}catch(e){$('msg').textContent=e.message}}}async function admin(){const us=await getDoc(doc(db,'users',u.uid));if(!us.exists()||us.data().role!=='admin')return $('msg').textContent='Admin access required.';document.body.innerHTML=`<main><div class="top"><div><h1>RestaurantFlow Admin</h1><p>Dashboard · Tables · Orders · Payment timing</p></div><button id="out">Sign out</button></div><section><h2>Customer QR</h2><p>Use this URL pattern for a table QR:</p><code>${location.origin+location.pathname}?tableId=TABLE_ID&amp;table=Table%201</code><p class="note">Open GitHub Pages first, then generate/print table QR codes using the hosted URL.</p></section><section><h2>Current orders</h2><div id="orders">Loading…</div></section><section><h2>Restaurant payment timing</h2><p>Change <code>restaurants/demo.paymentTiming</code> in Firestore to <b>postpaid</b>, <b>prepaid</b>, or <b>customer_choice</b>.</p></section></main>`;$('out').onclick=()=>signOut(auth);const os=await getDocs(collection(db,'orders'));$('orders').innerHTML=os.docs.map(d=>{const x=d.data();return `<article class="item"><div><b>${esc(d.id)}</b><small>Table ${esc(x.table||x.tableId)} · ${esc(x.status)} · ${money(x.total)}</small></div></article>`}).join('')||'No orders yet.'}
onAuthStateChanged(auth,x=>{u=x;if(tableId&&x)view()});view();
</script><style>body{margin:0;background:#f4f6f8;color:#17202a;font:16px Arial}main{max-width:1000px;margin:auto;padding:18px}section{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0 0 6px}input,select{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:9px}button{border:0;border-radius:9px;padding:11px 15px;background:#166534;color:#fff;font-weight:700}.item,.line{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #e2e8f0;padding:13px 0}.item small{display:block;color:#667085;margin-top:5px}.item p{margin:5px 0;color:#475569}.item button{white-space:nowrap}.line button{padding:6px 10px;margin-left:4px}.sum{padding:15px 0;font-size:18px}.pill{padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534}.note{padding:10px;background:#fff7ed;color:#9a3412;border-radius:8px;margin:10px 0}.ok{padding:10px;background:#dcfce7;color:#166534}.login{max-width:460px;margin:8vh auto}code{word-break:break-all;display:block;padding:10px;background:#f1f5f9;border-radius:8px}</style></head></html>
